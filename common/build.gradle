plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

// Plain Minecraft (NeoForm) only: a NeoForge or Fabric class used here fails to compile.
neoForge {
    neoFormVersion = project.neo_form_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
}

dependencies {
    compileOnly files(rootProject.file('libs/Cobblemon-neoforge-1.8.2+1.21.1.jar'))
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
    compileOnly 'net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
