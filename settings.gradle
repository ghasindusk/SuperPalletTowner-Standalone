pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'super_pallet_towner'
// common: loader-neutral code compiled against plain Minecraft (no loader API can slip in).
// neoforge / fabric: each compiles the common sources together with its own entry points.
include 'common', 'neoforge', 'fabric'
