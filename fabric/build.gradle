plugins {
    id 'fabric-loom'
}

base {
    archivesName = "${mod_id}-fabric"
}

// The shared code and assets live in ../common and are compiled into this Jar.
sourceSets.main.java.srcDir(rootProject.file('common/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('common/src/main/resources'))

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // Cobblemon (Fabric) for compiling only; players install it themselves.
    modCompileOnly files(rootProject.file("downloads_cobblemon_${cobblemon_version}/Cobblemon-fabric-${cobblemon_version}+1.21.1.jar"))
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
}


processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE'))
}
